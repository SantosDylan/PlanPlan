# Configuration nginx pour le site statique (montée dans conf.d/ par le Dockerfile).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css text/calendar application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    # Pas de routeur côté client dans l'app (aucun usage de pushState) : ce repli
    # ne sert donc qu'à ne pas rendre un 404 nu si une URL inconnue est ouverte.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fichiers hashés par Vite → le nom change à chaque contenu, donc immuables.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Le HTML référence les fichiers hashés : le cacher figerait le site sur une
    # version obsolète après un déploiement.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Les données sont régénérées 2×/jour par le cron d'ingestion : un cache long
    # afficherait une programmation périmée. 5 min suffisent à absorber les pics.
    location /data/ {
        add_header Cache-Control "public, max-age=300";
    }

    # `default_type` et pas un bloc `types { }` : un bloc `types` dans un contexte
    # imbriqué REMPLACE toute la table MIME héritée (le JS partirait alors en
    # octet-stream). `default_type` ne s'applique qu'aux extensions absentes de la
    # table — exactement notre cas.
    #
    # nginx ne connaît pas .ics (vérifié : absent de /etc/nginx/mime.types) et le
    # servirait en application/octet-stream, ce qui fait échouer l'abonnement
    # calendrier chez Apple/Outlook. Ce flux EST la fonction principale de l'app.
    location /calendar/ {
        default_type text/calendar;
        add_header Cache-Control "public, max-age=300";
    }

    # Même problème : sans ce type, Chrome refuse le manifeste et l'app n'est plus
    # installable en PWA.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }
}
